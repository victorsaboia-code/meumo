<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Amor 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="carousel">
      <img src="foto1.jpg" class="active">
      <img src="foto2.jpg">
      <img src="foto3.jpg">
      <img src="foto4.jpg">
      <img src="foto5.jpg">
    </div>

    <h1>Amor, te amo &lt;3</h1>
    <p>Cada momento com você vira memória boa.</p>
  </div>

  <script>
    const fotos = document.querySelectorAll('.carousel img');
    let atual = 0;

    setInterval(() => {
      fotos[atual].classList.remove('active');
      atual = (atual + 1) % fotos.length;
      fotos[atual].classList.add('active');
    }, 3000);
  </
